# Construit Magouille s'impose pour Windows, Mac (puces M et Intel) et Linux.
# - À la main : onglet Actions, « Construire l'appli », bouton Run workflow.
# - Automatiquement : quand une Release est créée avec un tag qui commence par v (ex. v1.2),
#   les fichiers sont ajoutés à la Release, prête à partager.
name: Construire l'appli
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nom: windows
          - os: macos-15
            nom: mac-puces-m
          - os: macos-15-intel
            nom: mac-intel
          - os: ubuntu-22.04
            nom: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }

      - run: pip install -r requirements.txt pyinstaller pillow
      - run: pyinstaller magouille_s_impose.spec --noconfirm

      - name: Ranger (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mkdir sortie && cp dist/Magouille.exe sortie/Magouille-s-impose-windows.exe

      - name: Ranger (Mac)
        if: runner.os == 'macOS'
        run: mkdir sortie && cd dist && ditto -c -k --keepParent Magouille.app ../sortie/Magouille-s-impose-${{ matrix.nom }}.zip

      - name: Ranger (Linux)
        if: runner.os == 'Linux'
        run: mkdir sortie && cd dist && chmod +x Magouille && tar -czf ../sortie/Magouille-s-impose-linux.tar.gz Magouille

      - uses: actions/upload-artifact@v5
        with:
          name: Magouille-s-impose-${{ matrix.nom }}
          path: sortie/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with: { path: tout, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: tout/*
